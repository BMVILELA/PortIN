<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portabilidades">
<title>Liga das Portabilidades</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Premium estilo Apple: preto verdadeiro, superfícies agrupadas #1c1c1e, letra do sistema (SF), controlos segmentados iOS, um só acento dourado discreto. Dourado = portabilidades, índigo = Voz Móvel. */
:root{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24); --line:rgba(84,84,88,.55);
  --fg:#ffffff; --muted:rgba(235,235,245,.6); --dim:rgba(235,235,245,.3);
  --gold:#e0b45c; --gold-2:#f0cf8c; --gold-ink:#1a1306; --seg-on:#636366;
  --cards:#7d7aff; --cards-soft:rgba(125,122,255,.2);
  --good:#30d158; --bad:#ff453a;
  --t-dia:#64d2ff; --t-ouro:#e0b45c; --t-prata:#c7c7cc; --t-bronze:#d0905f;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --fill:rgba(118,118,128,.12); --line:rgba(60,60,67,.18);
  --fg:#000000; --muted:rgba(60,60,67,.6); --dim:rgba(60,60,67,.3);
  --gold:#a8741a; --gold-2:#c99236; --gold-ink:#ffffff; --seg-on:#ffffff;
  --cards:#5856d6; --cards-soft:rgba(88,86,214,.14);
  --good:#248a3d; --bad:#d70015;
  --t-dia:#0071a4; --t-ouro:#a8741a; --t-prata:#8e8e93; --t-bronze:#a2643a;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f2f2f7; --fill:rgba(118,118,128,.12); --line:rgba(60,60,67,.18);
  --fg:#000000; --muted:rgba(60,60,67,.6); --dim:rgba(60,60,67,.3);
  --gold:#a8741a; --gold-2:#c99236; --gold-ink:#ffffff; --seg-on:#ffffff;
  --cards:#5856d6; --cards-soft:rgba(88,86,214,.14);
  --good:#248a3d; --bad:#d70015;
  --t-dia:#0071a4; --t-ouro:#a8741a; --t-prata:#8e8e93; --t-bronze:#a2643a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top svg{width:30px;height:30px;flex:none}
.top b{font-family:var(--f-display);font-weight:800;font-size:17px}
.note{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--muted);margin-bottom:14px}
.note b{color:var(--fg)}

/* entrada */
.title{font-size:26px;font-weight:800;line-height:1.1;margin-bottom:6px}
.list{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-height:60px}
.opt:active{transform:scale(.99)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff;background:linear-gradient(140deg,var(--cards),color-mix(in srgb,var(--cards) 45%,var(--gold)));flex:none}
.opt .t{font-weight:700;line-height:1.25}
.opt .s{font-size:13px;color:var(--muted)}
.opt .r{margin-left:auto;flex:none;color:var(--dim);font-size:22px}
.opt .ok{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);font-size:13px;font-weight:800}
.back{font-weight:600;color:var(--muted);padding:6px 0;margin-bottom:6px}
.search{width:100%;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--fg);font:inherit;font-size:16px}

/* registar */
.store{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.store h1{font-size:22px;font-weight:800;line-height:1.15}
.store .s{font-size:13px;color:var(--muted);margin-top:2px}
.swap{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;flex:none;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.gas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.ga{display:grid;gap:2px;justify-items:center;text-align:center;padding:16px 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0}
.ga:active{transform:scale(.98)}
.ga b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:.02em;color:var(--gold)}
.ga.adm{background:var(--gold);border-color:var(--gold)}
.ga.adm b,.ga.adm .t{color:var(--gold-ink)}
.ga.adm .s{color:var(--gold-ink);opacity:.75}
.ga .t{font-weight:600;font-size:14px;line-height:1.25}
.ga .s{font-size:12px;color:var(--muted)}
.cal{margin-bottom:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h{margin-bottom:4px}
.cal-h b{font-family:var(--f-display);font-size:15px;text-transform:capitalize}
.cal-h button{width:40px;height:30px;border-radius:9px;background:var(--surface-2);font-size:17px}
.cal-h button:disabled{opacity:.3}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wd{font-size:10.5px;font-weight:700;color:var(--dim);text-align:center}
.cd{position:relative;height:30px;border-radius:8px;background:var(--surface-2);font-weight:700;font-size:14px;display:grid;place-items:center;border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.cd:disabled{background:none;color:var(--dim);opacity:.45;cursor:default}
.cd.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface-2))}
.cd.ok::after{content:"✓";position:absolute;top:0;right:3px;font-size:9.5px;font-weight:800;color:var(--good)}
.cd.cmiss{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.cd.sel{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.cal-l{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.cal-l i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.alert{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);font-size:13.5px;margin-bottom:12px}
.alert.okk{background:color-mix(in srgb,var(--good) 10%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.alert b{font-weight:700}
.alert button{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--bad)}
.dsel{font-family:var(--f-display);font-weight:800;font-size:16px;margin:0 0 10px}
.fix{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.fix b{color:var(--fg)}
.dellink{display:block;width:100%;margin-top:8px;padding:8px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.delc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:14px;font-size:13.5px;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.delc span{flex:1 1 100%}
.delc button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--surface-2)}
.delc #delY{background:var(--bad);color:#fff}
.zero{width:100%;margin-top:8px;border-radius:14px;padding:12px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted)}
.zero:disabled{opacity:.45}
.field{display:grid;gap:6px;margin-bottom:10px}
.field label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.field label i{width:10px;height:10px;border-radius:3px}
.stepper{display:grid;grid-template-columns:58px 1fr 58px;gap:8px}
.stepper button{height:50px;border-radius:16px;background:var(--surface-2);font-size:28px;font-weight:600;line-height:1}
.stepper button:active{transform:scale(.95)}
.stepper input{width:100%;min-width:0;height:50px;text-align:center;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.res .tx{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;min-width:92px}
.res .bar{flex:1;height:10px;border-radius:99px;background:var(--cards-soft);position:relative;overflow:hidden}
.res .bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .3s}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:1.3em}
.hint.err{color:var(--bad)}
.save{width:100%;margin-top:14px;border-radius:16px;padding:17px;font:800 17px/1 var(--f-display);background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--gold-ink)}
.save:disabled{opacity:.45}

.month{display:flex;align-items:center;gap:14px;margin-top:14px}
.tier{width:52px;height:52px;flex:none}
.month .big{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1}
.month .s{font-size:13px;color:var(--muted)}
.month .pos{margin-left:auto;text-align:right;flex:none}
.month .pos b{font-family:var(--f-display);font-size:24px;font-weight:800;display:block;line-height:1}
.month .pos span{font-size:12px;color:var(--muted)}

/* ranking */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:12px 0 14px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.rk{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.me{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.row .p{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;flex:none;color:var(--muted);background:var(--surface-2)}
.row .p.m1{background:linear-gradient(140deg,#ffe39a,#d99a24);color:#1b1407}
.row .p.m2{background:linear-gradient(140deg,#f2f1f7,#a9a6b8);color:#1b1407}
.row .p.m3{background:linear-gradient(140deg,#f0c39c,#a8693e);color:#1b1407}
.row .n{min-width:0;flex:1}
.row .n b{display:block;font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n span{font-size:12px;color:var(--muted)}
.row .v{text-align:right;flex:none}
.row .v b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.row .v span{font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.foot{font-size:12.5px;color:var(--dim);margin-top:10px;text-align:center}
.admin{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;font-size:13px;color:var(--muted)}
.admin input{width:64px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px;color:var(--fg);font:inherit;text-align:center}
.admin button{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:600}

/* backoffice */
body.bo .app{max-width:1180px}
.bo-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bo-top h1{font-size:clamp(24px,4vw,32px);font-weight:800}
.pseg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.pseg button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.pseg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi small{font-size:15px;color:var(--muted)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 10px;font-size:13px}
.crumb{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid var(--gold);border-radius:999px;padding:4px 6px 4px 11px;font-weight:600}
.crumb button{width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:12px;line-height:1}
.bo-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lvl{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.lvl button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.lvl button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table.bo{width:100%;min-width:680px;border-collapse:collapse;font-size:14px}
table.bo th{position:sticky;top:0;background:var(--surface-2);text-align:right;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
table.bo th:first-child,table.bo td:first-child{text-align:left}
table.bo th[aria-sort] {color:var(--fg)}
table.bo td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.bo td:first-child{white-space:normal;min-width:200px}
table.bo td .nm{font-weight:600}
table.bo td .sb{font-size:12px;color:var(--muted)}
table.bo tbody tr.click{cursor:pointer}
table.bo tbody tr.click:hover{background:var(--surface-2)}
table.bo tfoot td{background:var(--surface-2);font-weight:800}
.mbar{width:120px;height:8px;border-radius:99px;background:var(--cards-soft);position:relative;display:inline-block;vertical-align:middle}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.mbar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.dpos{color:var(--good);font-weight:700}.dneg{color:var(--bad);font-weight:700}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.bo-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
@media (max-width:860px){.bo-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h2 span{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:600}
.panel svg{width:100%;height:auto;display:block}
.miss{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}
.miss span{font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:4px 8px}
.bo-link{display:block;margin:22px auto 0;font-weight:700;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

table.mxt{min-width:0}
table.mxt th.mxh{text-align:center;font-size:11px;line-height:1.3;cursor:pointer;min-width:62px}
table.mxt th.mxh:hover{color:var(--gold)}
table.mxt .stk{position:sticky;left:0;z-index:1;background:var(--surface);min-width:170px;max-width:220px;white-space:normal;text-align:left}
table.mxt thead .stk,table.mxt tfoot .stk{background:var(--surface-2)}
table.mxt thead .stk{z-index:2}
table.mxt td.mx{text-align:center;padding:7px 6px;line-height:1.15}
table.mxt td.mx b{display:block;font-size:13.5px}
table.mxt td.mx small{font-size:11px;color:var(--muted);font-weight:500}
table.mxt td.up b{color:var(--good)} table.mxt td.dn b{color:var(--bad)}
table.mxt td.up{background:color-mix(in srgb,var(--good) 9%,transparent)} table.mxt td.dn{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.dpick{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px;color:var(--fg);font:inherit;font-size:13px}
.bo-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlab{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
select.dpick{text-transform:capitalize}

table.mxt td.mfalta{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 55%,transparent)}
table.mxt td.mfalta b{color:var(--bad)}
table.mxt td.zr b{color:var(--muted)}
table.mxt td.mx em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--bad);margin-top:1px}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.gap{display:grid;gap:6px;max-height:300px;overflow:auto}
.gap div{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:13px}
.gap div span:first-child{min-width:0}
.gap div span:last-child{color:var(--bad);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mrows{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}

  if(!boLoaded){$("view").innerHTML=`<div class="empty" style="margin-top:60px"><b>A carregar dados…</b>Um momento.</div>`;loadBO();return}
  const [a,b]=boRange(),m=boAgg(a,b),scope=STORES.filter(inScope),tS=ymd(today());
  let c=0,p=0,hj=0;for(const s of scope){const v=m.get(s.s);if(v){c+=v.c;p+=v.p}if(dayEntry(s.s,tS))hj++}
  const t=c?p/c:null;
  const crumbs=[["c",BO.f.c&&CANAIS[BO.f.c]]].filter(x=>x[1]);
  const gaOpts=GA_ORDER.filter(g=>!BO.f.k||STORES.some(s=>s.g===g&&s.k===BO.f.k));
  const filt=`<div class="fbar"><label class="fsel"><span>Coordenador</span><select id="fK"><option value="">Todos</option>${Object.keys(KAMS).map(k=>`<option value="${k}" ${BO.f.k===k?"selected":""}>${KAMS[k].nome}</option>`).join("")}</select></label>
    <label class="fsel"><span>GA</span><select id="fG"><option value="">Todos</option>${gaOpts.map(g=>`<option value="${g}" ${BO.f.g===g?"selected":""}>${g} · ${GAS[g]}</option>`).join("")}</select></label>
    ${BO.f.k||BO.f.g||BO.f.c?`<button class="fclr" id="fClr">Limpar filtros</button>`:""}</div>`;
  const dl=x=>{if(x.t==null)return"—";const d=Math.round((x.t-S.objetivo)*100);return`<span class="${d>=0?"dpos":"dneg"}">${d>=0?"+":""}${d} pp</span>`};
  const N=n=>n.toLocaleString("pt-PT");
  let main="",copy=null;
  if(BO.tab==="res"){
    const rows=boRows(),MX=BO.view==="dia"?boMatrix(rows):null,isL=BO.level==="loja",next=LEVELS[LEVELS.findIndex(l=>l[0]===BO.level)+1];
    const th=(f,l)=>`<th data-sort="${f}" ${BO.sort===f?`aria-sort="${BO.dir<0?"descending":"ascending"}"`:""}>${l}${BO.sort===f?(BO.dir<0?" ↓":" ↑"):""}</th>`;
    const body=rows.map(x=>`<tr class="${next?"click":""}" data-key="${esc(x.key)}"><td><div class="nm">${esc(x.nm)}</div>${x.sb?`<div class="sb">${esc(x.sb)}</div>`:""}</td><td>${N(x.c)}</td><td>${N(x.p)}</td>
      <td style="font-weight:800;color:${x.t!=null&&x.t>=S.objetivo?"var(--gold)":"var(--fg)"}">${fmtPct(x.t)}</td><td>${dl(x)}</td>
      <td><span class="mbar"><i style="width:${x.t==null?0:Math.min(1,x.t)*100}%"></i><s style="left:${S.objetivo*100}%"></s></span></td></tr>`).join("");
    const mbody=rows.map(x=>`<button class="mrow ${next?"click":""}" data-key="${esc(x.key)}"><span class="ml"><b>${esc(x.nm)}</b>${x.sb?`<small>${esc(x.sb)}</small>`:""}</span>
      <span class="mr"><b class="num" style="color:${x.t!=null&&x.t>=S.objetivo?"var(--gold)":"var(--fg)"}">${fmtPct(x.t)}</b><small class="num">${x.p}/${x.c} · ${dl(x)}</small></span></button>`).join("")+`<div class="mrow tot"><span class="ml"><b>Total</b></span><span class="mr"><b class="num">${fmtPct(t)}</b><small class="num">${p}/${c}</small></span></div>`;
    const nd=daysBetween(a,b).length,minV=nd>=7?MIN_CARTOES:1,rk=scope.map(s=>({s,...(m.get(s.s)||{c:0,p:0})})).filter(x=>x.c>=minV).map(x=>({...x,t:x.p/x.c})).sort((x,y)=>y.t-x.t||y.p-x.p);
    const k=Math.min(5,Math.floor(rk.length/2)||rk.length),top=rk.slice(0,k),bot=rk.length>k?rk.slice(-k).reverse():[];
    const tb=(arr,cls,off)=>arr.map((x,i)=>`<div class="tbr"><span class="tp ${cls}">${off?rk.length-i:i+1}</span><span class="tn"><b>${esc(x.s.n)}</b><small>GA ${x.s.g}</small></span><span class="tv"><b class="num">${fmtPct(x.t)}</b><small class="num">${x.p}/${x.c}</small></span></div>`).join("")||`<p class="muted" style="margin:0;font-size:13px">Sem lojas com volume suficiente.</p>`;
    main=`<div class="panel" style="margin-bottom:12px"><h2>Evolução das portabilidades <span class="lvl sm" role="group" aria-label="Detalhe">${[["dia","Dia"],["sem","Semana"],["mes","Mês"]].map(([g,l])=>`<button data-gr="${g}" aria-pressed="${BO.gran===g}">${l}</button>`).join("")}</span></h2>${boChart()}
      <div style="display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap"><span>■ <span style="color:var(--cards)">Voz Móvel</span></span><span>■ <span style="color:var(--gold)">Portabilidades</span></span><span>% = taxa de portabilidade</span></div></div>
    <div class="tb2"><div class="panel"><h2>Top lojas <span>melhor taxa</span></h2>${tb(top,"up",false)}</div><div class="panel"><h2>Bottom lojas <span>pior taxa</span></h2>${tb(bot,"dn",true)}</div></div>
    <p class="foot" style="text-align:left;margin:6px 0 14px">Top e Bottom contam lojas com pelo menos ${minV} venda${minV>1?"s":""} de Voz Móvel no período (${rk.length} loja${rk.length===1?"":"s"}).</p>
    <div class="bo-bar"><div class="bo-ctl"><div class="lvl" role="group" aria-label="Nível">${LEVELS.map(([k,l])=>`<button data-lv="${k}" aria-pressed="${BO.level===k}">${l}</button>`).join("")}</div><div class="lvl" role="group" aria-label="Vista"><button data-vw="resumo" aria-pressed="${BO.view==="resumo"}">Resumo</button><button data-vw="dia" aria-pressed="${BO.view==="dia"}">Por dia</button></div></div><button class="ghost" id="copy">Copiar tabela para Excel</button></div>
    ${MX?MX.html:`<div class="mrows">${mbody}</div><div class="tbl-wrap desk"><table class="bo"><thead><tr>${th("nm",LEVELS.find(l=>l[0]===BO.level)[1])}${th("c","Voz Móvel")}${th("p","Portab.")}${th("t","Taxa")}<th>vs objetivo</th><th></th></tr></thead>
    <tbody>${body||`<tr><td colspan="6" class="empty">Sem dados para este filtro.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td><td>${N(c)}</td><td>${N(p)}</td><td>${fmtPct(t)}</td><td>${dl({t})}</td><td></td></tr></tfoot></table></div>`}
    ${MX?`<p class="foot" style="text-align:left">Verde = dia acima do objetivo. Clica numa data para ver só esse dia.</p>`:next?`<p class="foot" style="text-align:left">Clica numa linha para ver ${({kam:"os coordenadores",ga:"os GAs",loja:"as lojas"})[next[0]]}.</p>`:""}`;
    copy=()=>MX?[[LEVELS.find(l=>l[0]===BO.level)[1],...MX.days.map(dm)].join("\t"),...rows.map(r=>[r.nm,...MX.days.map(d=>{const v=MX.cell[r.key+"|"+d];return v&&v.c?(v.p/v.c*100).toFixed(1).replace(".",",")+"%":""})].join("\t"))].join("\n")
      :[[LEVELS.find(l=>l[0]===BO.level)[1],"Voz Móvel","Portabilidades","Taxa"].join("\t"),...rows.map(x=>[x.nm,x.c,x.p,x.t==null?"":(x.t*100).toFixed(1).replace(".",",")+"%"].join("\t"))].join("\n");
    var after=()=>{
      document.querySelectorAll("[data-gr]").forEach(x=>x.onclick=()=>{BO.gran=x.dataset.gr;render()});
      document.querySelectorAll("[data-vw]").forEach(x=>x.onclick=()=>{BO.view=x.dataset.vw;render()});
      document.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{BO.mode="int";BO.from=BO.to=x.dataset.day;BO.view="resumo";render()});
      document.querySelectorAll("[data-lv]").forEach(x=>x.onclick=()=>{BO.level=x.dataset.lv;render()});
      document.querySelectorAll("[data-sort]").forEach(x=>x.onclick=()=>{const f=x.dataset.sort;if(BO.sort===f)BO.dir*=-1;else{BO.sort=f;BO.dir=f==="nm"?1:-1}render()});
      if(next)document.querySelectorAll(".click[data-key]").forEach(r=>r.onclick=()=>{const cur=LEVELS.find(l=>l[0]===BO.level)[2];BO.f[cur]=r.dataset.key;if(cur==="g")BO.f.k=(STORES.find(s=>s.g===r.dataset.key)||{}).k;BO.level=next[0];if(cur!=="c")lsSet("lp.bof",{k:BO.f.k||null,g:BO.f.g||null});render()});
    };
  } else {
    const {ex,rows}=boMiss(),expT=rows.reduce((n,x)=>n+x.exp,0),misT=rows.reduce((n,x)=>n+x.mis,0),lojF=new Set(rows.flatMap(x=>x.st.map(y=>y.s.s))).size,isL=BO.mlevel==="loja";
    const dts=mi=>mi.length>12?mi.slice(0,12).map(dm).join(", ")+` e mais ${mi.length-12}`:mi.map(dm).join(", ");
    const list=rows.map(x=>{const open=BO.open.has(BO.mlevel+"|"+x.key);
      return`<div class="frow ${x.mis?"":"fok"}"><div class="fh"><span class="fn"><b>${esc(x.nm)}</b>${x.sb?`<small>${esc(x.sb)}</small>`:""}</span>
        <span class="fv">${x.mis?`<b class="num">faltam ${x.mis} dia${x.mis>1?"s":""}</b><small class="num">de ${x.exp}${isL?"":` · ${x.st.length}/${x.lojas} lojas`}</small>`:`<b class="okc">completo</b><small class="num">${x.exp} de ${x.exp} dias</small>`}</span>
        ${x.mis?`<button class="fb" data-open="${esc(x.key)}" aria-expanded="${open}">${open?"− detalhe":"+ detalhe"}</button>`:`<span class="fb ph"></span>`}</div>
        ${open&&x.mis?`<div class="fd">${isL?`<span class="muted">Dias em falta:</span> ${dts(x.st[0].mi)}`:x.st.map(y=>`<div><span>${esc(y.s.n)}${BO.mlevel==="kam"?` <span class="muted">· ${y.s.g}</span>`:""}</span><span>${y.mi.length} dia${y.mi.length>1?"s":""}: ${dts(y.mi)}</span></div>`).join("")}</div>`:""}</div>`}).join("");
    main=`<div class="kpis k3"><div class="kpi"><b class="num" style="color:${misT?"var(--bad)":"var(--good)"}">${N(misT)}<small>/${N(expT)}</small></b><span>Dias em falta</span></div><div class="kpi"><b class="num">${lojF}<small>/${scope.length}</small></b><span>Lojas com dias em falta</span></div><div class="kpi"><b class="num">${hj}<small>/${scope.length}</small></b><span>Lojas com registo hoje</span></div></div>
    <div class="bo-bar"><div class="lvl" role="group" aria-label="Nível">${[["kam","Coordenadores"],["ga","GAs"],["loja","Lojas"]].map(([k,l])=>`<button data-ml="${k}" aria-pressed="${BO.mlevel===k}">${l}</button>`).join("")}</div><button class="ghost" id="copy">Copiar para Excel</button></div>
    ${ex.length?`<div class="flist">${list}</div>`:`<div class="panel"><p class="muted" style="margin:0">Ainda não há dias fechados neste período. O dia de hoje só conta a partir de amanhã.</p></div>`}
    <p class="foot" style="text-align:left">Conta os dias de ${dm(a)} a ${dm(b)} até ontem. Um dia com 0 vendas guardado conta como preenchido.</p>`;
    copy=()=>[["Nome","Dias em falta","Dias esperados","Detalhe"].join("\t"),...rows.map(x=>[x.nm,x.mis,x.exp,x.st.map(y=>(isL?"":y.s.n+": ")+y.mi.map(dm).join(" ")).join(" | ")].join("\t"))].join("\n");
    var after=()=>{
      document.querySelectorAll("[data-ml]").forEach(x=>x.onclick=()=>{BO.mlevel=x.dataset.ml;render()});
      document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>{const k=BO.mlevel+"|"+x.dataset.open;BO.open.has(k)?BO.open.delete(k):BO.open.add(k);const y=scrollY;render();scrollTo(0,y)});
    };
  }
  $("view").innerHTML=`<div class="bo-top"><div><button class="back" id="boBack">‹ App das lojas</button><h1>Backoffice portabilidades</h1></div>
    <div class="bo-ctl"><div class="pseg" role="group" aria-label="Período"><button data-md="mes" aria-pressed="${BO.mode==="mes"}">Mês</button><button data-md="int" aria-pressed="${BO.mode==="int"}">Intervalo</button></div>
    ${BO.mode==="mes"?`<select id="msel" class="dpick" aria-label="Mês">${boMonths().map(mm=>`<option value="${mm}" ${mm===a.slice(0,7)?"selected":""}>${MESES[+mm.slice(5)-1]} ${mm.slice(0,4)}</option>`).join("")}</select>`
    :`<label class="dlab">De <input type="date" id="dfrom" class="dpick" value="${a}" min="${INICIO}" max="${tS}"></label><label class="dlab">Até <input type="date" id="dto" class="dpick" value="${b}" min="${INICIO}" max="${tS}"></label>`}</div></div>
  <div class="tabs" role="tablist"><button role="tab" data-tab="res" aria-selected="${BO.tab==="res"}">Resultados</button><button role="tab" data-tab="falta" aria-selected="${BO.tab==="falta"}">Dados em falta</button></div>
  ${filt}
  ${crumbs.length?`<div class="crumbs"><span class="muted">Filtro:</span>${crumbs.map(([k,l])=>`<span class="crumb">${esc(l)}<button data-rm="${k}" aria-label="Remover filtro">✕</button></span>`).join("")}</div>`:""}
  ${BO.tab==="res"?`<div class="kpis k3"><div class="kpi"><b class="num" style="color:var(--cards)">${N(c)}</b><span>Voz Móvel</span></div><div class="kpi"><b class="num" style="color:var(--gold)">${N(p)}</b><span>Portabilidades</span></div><div class="kpi"><b class="num">${fmtPct(t)}</b><span>Taxa · objetivo ${fmtPct(S.objetivo)}</span></div></div>`:""}
  ${main}`;
  $("boBack").onclick=()=>{location.hash="";document.body.classList.remove("bo");go(S.store?"reg":"ga");refresh()};
  document.querySelectorAll("[data-md]").forEach(x=>x.onclick=()=>{BO.mode=x.dataset.md;render()});
  if($("msel"))$("msel").onchange=e=>{BO.month=e.target.value;render()};
  if($("dfrom"))$("dfrom").onchange=e=>{if(e.target.value){BO.from=e.target.value;if(!BO.to)BO.to=b;render()}};
  if($("dto"))$("dto").onchange=e=>{if(e.target.value){BO.to=e.target.value;if(!BO.from)BO.from=a;render()}};
  document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{BO.tab=x.dataset.tab;render()});
  document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{delete BO.f[x.dataset.rm];render()});
  const saveF=()=>lsSet("lp.bof",{k:BO.f.k||null,g:BO.f.g||null});
  $("fK").onchange=e=>{BO.f.k=e.target.value||undefined;if(BO.f.g&&BO.f.k&&!STORES.some(s=>s.g===BO.f.g&&s.k===BO.f.k))BO.f.g=undefined;if(BO.f.k&&BO.level==="canal")BO.level="ga";saveF();render()};
  $("fG").onchange=e=>{const g=e.target.value||undefined;BO.f.g=g;if(g){BO.f.k=(STORES.find(s=>s.g===g)||{}).k;if(BO.level!=="loja")BO.level="loja";if(BO.mlevel!=="loja")BO.mlevel="loja"}saveF();render()};
  if($("fClr"))$("fClr").onclick=()=>{BO.f={};saveF();render()};
  after();
  if(BO.tab==="res"&&!$("objS"))$("view").insertAdjacentHTML("beforeend",`<div class="admin"><label for="obj">Objetivo da liga (%)</label><input id="obj" type="number" min="1" max="100" value="${Math.round(S.objetivo*100)}"><button id="objS">Guardar objetivo</button></div>`);
  if($("objS"))$("objS").onclick=async()=>{const v=Math.max(1,Math.min(100,parseInt($("obj").value)||50))/100;try{await rpc("bo_objetivo",{p_pass:BOPASS,p_valor:v});S.objetivo=v;render();toast("Objetivo atualizado.")}catch(e){toast("Não foi possível guardar o objetivo.")}};
  if($("copy"))$("copy").onclick=()=>{try{navigator.clipboard.writeText(copy()).then(()=>toast("Copiado. Cola no Excel."),()=>toast("Não foi possível copiar."))}catch(e){toast("Não foi possível copiar.")}};
}

$("tReg").onclick=()=>go("reg");$("tRank").onclick=()=>go("rank");
(function(){const st=lsGet("lp.store");if(st&&BY.has(st)){S.store=st;S.ga=BY.get(st).g;S.screen="reg"}if(location.hash==="#bo")S.screen="bo";render()})();
addEventListener("hashchange",()=>{if(location.hash==="#bo")go("bo")});
async function refresh(){
  if(!db)return;
  try{
    if(S.screen==="bo"){if(boOk&&BOPASS)await loadBO();return}
    await loadPub();if(S.store)await loadStore(S.store);note="";
  }catch(e){note="<b>Sem ligação.</b> Os números podem estar desatualizados."}
  const ae=document.activeElement;if(ae&&(/^in[CP]$/.test(ae.id)||ae.id==="q"||ae.id==="pw"))return;
  if(!saving)render();
}
(async function(){
  if(!CONFIG_OK){loaded=true;render();return}
  try{
    const cfg=await rpc("liga_config");db=true;
    if(cfg&&cfg.inicio)INICIO=cfg.inicio;
    const v=+(cfg&&cfg.objetivo);if(v>0&&v<=1)S.objetivo=v;
    await loadPub();if(S.store)await loadStore(S.store);
  }catch(e){db=null}
  loaded=true;draft=null;render();
  if(S.screen==="bo"&&boOk)loadBO();
  setInterval(()=>{if(!document.hidden)refresh()},90000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>
</body>
</html>
